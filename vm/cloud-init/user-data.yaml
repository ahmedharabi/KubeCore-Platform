#cloud-config

package_update: true

packages:
  - curl
  - ca-certificates
  - git
  - jq
  - vim
  - htop
  - qemu-guest-agent
  - chrony
  - openssh-server

users:
  - name: __SSH_USER__
    groups:
      - sudo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - __SSH_PUBLIC_KEY__

ssh_pwauth: false

runcmd:
  - systemctl enable --now qemu-guest-agent
  - systemctl enable --now chrony
  - swapoff -a
  - sed -i '/ swap / s/^/#/' /etc/fstab

final_message: "RKE2 homelab VM initialization complete."
